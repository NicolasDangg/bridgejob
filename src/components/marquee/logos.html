<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .marquee {
            --marquee-gap: 72px;
            --marquee-speed: 35s;
            display: flex;
            overflow: hidden;
            gap: var(--marquee-gap);
            padding: 40px 0;
        }

        .marquee__group {
            display: flex;
            gap: var(--marquee-gap);
            flex-shrink: 0;
            align-items: center;
            animation: marquee-scroll var(--marquee-speed) linear infinite;
        }

        @keyframes marquee-scroll {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(calc(-100% - var(--marquee-gap)));
            }
        }

        .marquee:hover .marquee__group {
            animation-play-state: paused;
        }

        .marquee--reverse .marquee__group {
            animation-direction: reverse;
        }

        .marquee--slow {
            --marquee-speed: 50s;
        }

        .marquee--fast {
            --marquee-speed: 15s;
        }

        .marquee .logo-item {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .marquee .logo-item svg,
        .marquee .logo-item img {
            width: 58px;
            height: 58px;
            flex-shrink: 0;
            filter: grayscale(1) opacity(0.3);
            transition: filter 0.4s ease, transform 0.4s ease;
        }

        .marquee .logo-item.is-center svg,
        .marquee .logo-item.is-center img {
            filter: grayscale(0) opacity(1);
            transform: scale(1.25);
        }

        @media (prefers-reduced-motion: reduce) {
            .marquee__group {
                animation-play-state: paused;
            }
        }
    </style>
</head>

    <script>
        function initMarqueeHighlight(marqueeEl, options = {}) {
            if (!marqueeEl) return;
            const zone = options.zone || 0.18;
            let rafId;
            function update() {
                const items = marqueeEl.querySelectorAll('.logo-item');
                const rect = marqueeEl.getBoundingClientRect();
                const center = rect.left + rect.width / 2;
                const threshold = rect.width * zone;
                items.forEach(item => {
                    const r = item.getBoundingClientRect();
                    const mid = r.left + r.width / 2;
                    item.classList.toggle('is-center', Math.abs(mid - center) < threshold);
                });
                rafId = requestAnimationFrame(update);
            }
            update();
            return function destroy() { cancelAnimationFrame(rafId); };
        }
        document.querySelectorAll('[data-marquee-highlight]').forEach(el => {
            initMarqueeHighlight(el, { zone: parseFloat(el.dataset.marqueeHighlight) || 0.18 });
        });
    </script>
