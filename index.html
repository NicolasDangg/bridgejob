<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BridgeJob - Career Skill Gap Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --white: #ffffff;
      --off-white: #f7f7f5;
      --light-gray: #eeede9;
      --mid-gray: #9a9a9a;
      --dark: #1a1a1a;
      --accent: #1b4fff;
      --accent-hover: #1340cc;
      --critical: #d93025;
      --important: #e07b00;
      --nice: #1a7f4b;
      --match: #1a7f4b;
      --header-height: 74px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--white);
      color: var(--dark);
      font-family: "DM Sans", sans-serif;
      line-height: 1.45;
    }

    body {
      padding-top: var(--header-height);
    }

    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid var(--light-gray);
      background: var(--white);
      z-index: 10;
    }

    .brand {
      margin: 0;
      font-family: "DM Serif Display", serif;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--dark);
    }

    .tagline {
      margin: 0;
      font-size: 13px;
      color: var(--mid-gray);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    .container {
      width: min(1180px, 100% - 48px);
      margin: 40px auto 64px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .field-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field-label {
      font-size: 13px;
      color: var(--mid-gray);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      border: 1px solid var(--light-gray);
      border-radius: 0;
      padding: 12px;
      font-family: "DM Sans", sans-serif;
      font-size: 14px;
      color: var(--dark);
      background: var(--white);
      resize: vertical;
      transition: border-color 200ms ease, background-color 200ms ease;
    }

    textarea::placeholder {
      color: #b2b2b2;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: #fcfdff;
    }

    .field-error {
      min-height: 20px;
      color: var(--critical);
      font-size: 13px;
      line-height: 1.4;
    }

    .action-row {
      margin-top: 10px;
    }

    .analyze-btn {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 0;
      background: var(--accent);
      color: var(--white);
      font-family: "DM Sans", sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 200ms ease, opacity 200ms ease;
    }

    .analyze-btn:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .analyze-btn:disabled {
      cursor: not-allowed;
      opacity: 0.85;
    }

    .loading-wrap {
      height: 6px;
      margin-top: 10px;
      border: 1px solid var(--light-gray);
      background: var(--off-white);
      overflow: hidden;
      display: none;
    }

    .loading-wrap.active {
      display: block;
    }

    .loading-bar {
      width: 35%;
      height: 100%;
      background: var(--accent);
      animation: loadingSlide 1.1s ease-in-out infinite;
    }

    @keyframes loadingSlide {
      0% {
        transform: translateX(-120%);
      }
      100% {
        transform: translateX(400%);
      }
    }

    .api-error {
      min-height: 22px;
      margin-top: 10px;
      color: var(--critical);
      font-size: 13px;
      line-height: 1.4;
    }

    .results {
      display: none;
      margin-top: 48px;
      padding-top: 48px;
      border-top: 1px solid var(--light-gray);
    }

    .results.active {
      display: block;
    }

    .results-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 30px;
    }

    .job-title {
      margin: 0;
      font-family: "DM Serif Display", serif;
      font-size: 28px;
      font-weight: 400;
      line-height: 1.2;
      color: var(--dark);
    }

    .fit-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 11px;
      letter-spacing: 0.06em;
      font-weight: 600;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .fit-strong {
      background: #e8f5ee;
      color: var(--match);
      border: 1px solid #cae8d7;
    }

    .fit-moderate {
      background: #eaf0ff;
      color: var(--accent);
      border: 1px solid #cfdbff;
    }

    .fit-weak {
      background: #fff3e8;
      color: var(--important);
      border: 1px solid #ffe0bf;
    }

    .fit-severe {
      background: #fdeceb;
      color: var(--critical);
      border: 1px solid #f9ccc8;
    }

    .readiness {
      margin-bottom: 34px;
    }

    .score-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 28px;
      align-items: center;
      margin-bottom: 12px;
    }

    .score-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1;
    }

    .score-number {
      font-family: "DM Serif Display", serif;
      font-size: 64px;
      font-weight: 400;
      color: var(--dark);
      margin: 0;
    }

    .score-label {
      margin-top: 8px;
      font-size: 11px;
      color: var(--mid-gray);
      letter-spacing: 0.06em;
      font-weight: 600;
      text-transform: uppercase;
    }

    .score-bar {
      width: 100%;
      height: 4px;
      background: var(--light-gray);
      position: relative;
      overflow: hidden;
    }

    .score-fill {
      height: 100%;
      width: 0;
      transition: width 200ms ease;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0));
    }

    .summary {
      max-width: 640px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--mid-gray);
      margin: 16px 0 0;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 34px;
    }

    .skills-col {
      border-top: 1px solid var(--light-gray);
      padding-top: 10px;
    }

    .skills-title {
      margin: 0 0 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
    }

    .skills-title.match {
      color: var(--match);
    }

    .skills-title.important {
      color: var(--important);
    }

    .skills-title.critical {
      color: var(--critical);
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      border: 1px solid var(--light-gray);
      border-left-width: 1px;
      border-radius: 4px;
      padding: 10px 12px;
      background: var(--off-white);
      transition: background-color 200ms ease, border-color 200ms ease;
    }

    .item-card.match {
      border-left: 1px solid var(--match);
      background: #f8fcf9;
    }

    .item-card.important {
      border-left: 1px solid var(--important);
      background: #fffaf4;
    }

    .item-card.critical {
      border-left: 1px solid var(--critical);
      background: #fff8f8;
    }

    .item-skill {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--dark);
    }

    .item-note,
    .item-gap {
      margin: 4px 0 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--mid-gray);
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      border: 1px solid var(--light-gray);
      border-radius: 3px;
      font-size: 11px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--dark);
      background: var(--white);
    }

    .meta-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    .priority-critical {
      background: var(--critical);
    }

    .priority-important {
      background: var(--important);
    }

    .priority-nice {
      background: var(--nice);
    }

    .action {
      margin: 8px 0 0;
      padding-top: 8px;
      border-top: 1px solid var(--light-gray);
      font-size: 13px;
      color: var(--dark);
      font-style: italic;
      line-height: 1.45;
    }

    .empty-msg {
      margin: 0;
      padding: 8px 0;
      color: var(--mid-gray);
      font-size: 13px;
      font-style: italic;
    }

    .noise {
      margin-top: 26px;
      padding-top: 14px;
      border-top: 1px solid var(--light-gray);
    }

    .noise-label {
      margin: 0 0 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--mid-gray);
      font-weight: 700;
    }

    .noise-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .noise-tag {
      background: var(--light-gray);
      color: var(--dark);
      font-size: 13px;
      padding: 4px;
      border-radius: 3px;
      text-decoration: line-through;
    }

    .bridge-plan {
      margin-top: 34px;
    }

    .bridge-title {
      margin: 0 0 12px;
      font-family: "DM Serif Display", serif;
      font-size: 20px;
      font-weight: 400;
      color: var(--dark);
    }

    .step-list {
      border-top: 1px solid var(--light-gray);
    }

    .step-row {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 14px;
      align-items: start;
      padding: 12px 0;
      border-bottom: 1px solid var(--light-gray);
      transition: background-color 200ms ease;
    }

    .step-row:hover {
      background: var(--off-white);
    }

    .step-index {
      font-family: "DM Serif Display", serif;
      color: var(--accent);
      font-size: 32px;
      line-height: 1;
      text-align: center;
      margin-top: 2px;
    }

    .step-text {
      margin: 0;
      font-size: 14px;
      color: var(--dark);
      line-height: 1.5;
    }

    .analyst-note {
      margin-top: 22px;
      padding: 12px;
      border: 1px solid #f59e0b;
      background: #fffbeb;
      border-radius: 4px;
      display: none;
    }

    .analyst-note.active {
      display: block;
    }

    .analyst-note-label {
      margin: 0 0 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #92400e;
      font-weight: 700;
    }

    .analyst-note-text {
      margin: 0;
      color: var(--dark);
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 767px) {
      .app-header {
        padding: 0 16px;
        height: 66px;
      }

      :root {
        --header-height: 66px;
      }

      .brand {
        font-size: 22px;
      }

      .tagline {
        font-size: 11px;
      }

      .container {
        width: min(1180px, 100% - 24px);
        margin-top: 24px;
      }

      .input-grid,
      .skills-grid,
      .score-row,
      .results-header {
        grid-template-columns: 1fr;
      }

      .results-header {
        gap: 10px;
      }

      .score-number {
        font-size: 54px;
      }

      .step-row {
        grid-template-columns: 40px 1fr;
      }

      .step-index {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1 class="brand">BridgeJob</h1>
    <p class="tagline">Know where you stand.</p>
  </header>

  <main class="container">
    <section aria-label="Analyzer Inputs">
      <div class="input-grid">
        <div class="field-wrap">
          <label class="field-label" for="jdInput">Job Description</label>
          <textarea id="jdInput" placeholder="Paste the full job description here..."></textarea>
          <div class="field-error" id="jdError" aria-live="polite"></div>
        </div>

        <div class="field-wrap">
          <label class="field-label" for="skillsInput">Your Skills</label>
          <textarea
            id="skillsInput"
            placeholder="Describe your current skills and experience..."
          ></textarea>
          <div class="field-error" id="skillsError" aria-live="polite"></div>
        </div>
      </div>

      <div class="action-row">
        <button id="analyzeBtn" class="analyze-btn" type="button">Analyze My Fit</button>
        <div id="loadingWrap" class="loading-wrap" aria-hidden="true">
          <div class="loading-bar"></div>
        </div>
        <div id="apiError" class="api-error" aria-live="polite"></div>
      </div>
    </section>

    <section id="resultsSection" class="results" aria-label="Analysis Results">
      <div class="results-header">
        <h2 id="jobTitle" class="job-title"></h2>
        <div id="fitBadge" class="fit-badge"></div>
      </div>

      <div class="readiness">
        <div class="score-row">
          <div class="score-wrap">
            <p id="scoreNumber" class="score-number">0</p>
            <span class="score-label">Readiness Score</span>
          </div>
          <div class="score-bar" aria-label="Readiness score bar">
            <div id="scoreFill" class="score-fill"></div>
          </div>
        </div>
        <p id="overallSummary" class="summary"></p>
      </div>

      <div class="skills-grid">
        <div class="skills-col">
          <p class="skills-title match">Strong Matches</p>
          <div id="strongList" class="item-list"></div>
        </div>

        <div class="skills-col">
          <p class="skills-title important">Partial Matches</p>
          <div id="partialList" class="item-list"></div>
        </div>

        <div class="skills-col">
          <p class="skills-title critical">Gaps</p>
          <div id="gapsList" class="item-list"></div>
        </div>
      </div>

      <div class="noise">
        <p class="noise-label">Filtered Noise</p>
        <div id="noiseTags" class="noise-tags"></div>
      </div>

      <div class="bridge-plan">
        <h3 class="bridge-title">Your Bridge Plan</h3>
        <div id="stepList" class="step-list"></div>
      </div>

      <div id="analystNote" class="analyst-note">
        <p class="analyst-note-label">Analyst Note</p>
        <p id="analystNoteText" class="analyst-note-text"></p>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const jdInput = document.getElementById("jdInput");
      const skillsInput = document.getElementById("skillsInput");
      const analyzeBtn = document.getElementById("analyzeBtn");

      const jdError = document.getElementById("jdError");
      const skillsError = document.getElementById("skillsError");
      const apiError = document.getElementById("apiError");
      const loadingWrap = document.getElementById("loadingWrap");

      const resultsSection = document.getElementById("resultsSection");
      const jobTitle = document.getElementById("jobTitle");
      const fitBadge = document.getElementById("fitBadge");
      const scoreNumber = document.getElementById("scoreNumber");
      const scoreFill = document.getElementById("scoreFill");
      const overallSummary = document.getElementById("overallSummary");

      const strongList = document.getElementById("strongList");
      const partialList = document.getElementById("partialList");
      const gapsList = document.getElementById("gapsList");
      const noiseTags = document.getElementById("noiseTags");
      const stepList = document.getElementById("stepList");
      const analystNote = document.getElementById("analystNote");
      const analystNoteText = document.getElementById("analystNoteText");

      let inFlight = false;

      const FIT_CLASS_MAP = {
        STRONG: "fit-strong",
        MODERATE: "fit-moderate",
        WEAK: "fit-weak",
        "SEVERELY UNDERQUALIFIED": "fit-severe",
      };

      function setLoadingState(loading) {
        inFlight = loading;
        analyzeBtn.disabled = loading;
        analyzeBtn.textContent = loading ? "Analyzing..." : "Analyze My Fit";
        loadingWrap.classList.toggle("active", loading);
      }

      function setText(el, value) {
        el.textContent = typeof value === "string" ? value : "";
      }

      function createEmptyMessage() {
        const p = document.createElement("p");
        p.className = "empty-msg";
        p.textContent = "None identified";
        return p;
      }

      function createStrongCard(item) {
        const card = document.createElement("article");
        card.className = "item-card match";

        const skill = document.createElement("p");
        skill.className = "item-skill";
        skill.textContent = item.skill || "Unnamed skill";

        const note = document.createElement("p");
        note.className = "item-note";
        note.textContent = item.note || "No note provided.";

        card.append(skill, note);
        return card;
      }

      function getPriorityDotClass(priority) {
        const normalized = String(priority || "").toUpperCase();
        if (normalized === "CRITICAL") return "priority-critical";
        if (normalized === "IMPORTANT") return "priority-important";
        return "priority-nice";
      }

      function createMetaBadge(label, content, dotClass) {
        const badge = document.createElement("span");
        badge.className = "meta-badge";

        if (dotClass) {
          const dot = document.createElement("span");
          dot.className = "meta-dot " + dotClass;
          badge.appendChild(dot);
        }

        const text = document.createElement("span");
        text.textContent = label + ": " + content;
        badge.appendChild(text);

        return badge;
      }

      function createGapLikeCard(item, variant, includeGapDetail) {
        const card = document.createElement("article");
        card.className = "item-card " + variant;

        const skill = document.createElement("p");
        skill.className = "item-skill";
        skill.textContent = item.skill || "Unnamed skill";
        card.appendChild(skill);

        if (includeGapDetail) {
          const gap = document.createElement("p");
          gap.className = "item-gap";
          gap.textContent = item.gap_detail || "No gap detail provided.";
          card.appendChild(gap);
        }

        const metaRow = document.createElement("div");
        metaRow.className = "meta-row";

        const priorityText = item.priority || "N/A";
        const priorityClass = getPriorityDotClass(priorityText);
        metaRow.appendChild(createMetaBadge("Priority", priorityText, priorityClass));

        const learnabilityText = item.learnability || "N/A";
        metaRow.appendChild(createMetaBadge("\u23F1", learnabilityText));

        card.appendChild(metaRow);

        const action = document.createElement("p");
        action.className = "action";
        action.textContent = item.action || "No action provided.";
        card.appendChild(action);

        return card;
      }

      function renderList(target, items, buildItem) {
        target.innerHTML = "";
        if (!Array.isArray(items) || items.length === 0) {
          // Shared empty state for all result collections.
          target.appendChild(createEmptyMessage());
          return;
        }

        items.forEach(function (item) {
          target.appendChild(buildItem(item || {}));
        });
      }

      function renderNoiseSkills(items) {
        noiseTags.innerHTML = "";
        if (!Array.isArray(items) || items.length === 0) {
          noiseTags.appendChild(createEmptyMessage());
          return;
        }

        items.forEach(function (skill) {
          const tag = document.createElement("span");
          tag.className = "noise-tag";
          tag.textContent = skill;
          noiseTags.appendChild(tag);
        });
      }

      function renderBridgeSteps(items) {
        stepList.innerHTML = "";
        if (!Array.isArray(items) || items.length === 0) {
          stepList.appendChild(createEmptyMessage());
          return;
        }

        items.forEach(function (stepText, index) {
          const row = document.createElement("article");
          row.className = "step-row";

          const stepNumber = document.createElement("p");
          stepNumber.className = "step-index";
          stepNumber.textContent = String(index + 1);

          const stepBody = document.createElement("p");
          stepBody.className = "step-text";
          stepBody.textContent = stepText;

          row.append(stepNumber, stepBody);
          stepList.appendChild(row);
        });
      }

      function updateFitBadge(overallFit) {
        const label = typeof overallFit === "string" ? overallFit : "UNKNOWN";
        fitBadge.textContent = label;
        fitBadge.className = "fit-badge " + (FIT_CLASS_MAP[label] || "fit-moderate");
      }

      function updateScore(scoreValue) {
        // Clamp score to protect the UI from out-of-range API values.
        const safeScore = Number.isFinite(scoreValue) ? Math.max(0, Math.min(100, scoreValue)) : 0;
        scoreNumber.textContent = String(Math.round(safeScore));
        scoreFill.style.width = safeScore + "%";

        if (safeScore >= 70) {
          scoreFill.style.background = "linear-gradient(90deg, #1b4fff 0%, #4b74ff 100%)";
          return;
        }

        if (safeScore >= 40) {
          scoreFill.style.background = "linear-gradient(90deg, #e07b00 0%, #f29a2d 100%)";
          return;
        }

        scoreFill.style.background = "linear-gradient(90deg, #d93025 0%, #e55e55 100%)";
      }

      function renderAnalystNote(noteText) {
        const clean = typeof noteText === "string" ? noteText.trim() : "";
        if (!clean) {
          analystNote.classList.remove("active");
          analystNoteText.textContent = "";
          return;
        }

        analystNoteText.textContent = clean;
        analystNote.classList.add("active");
      }

      function renderResults(data) {
        setText(jobTitle, data.job_title || "Untitled Role");
        updateFitBadge(data.overall_fit);
        updateScore(data.readiness_score);
        setText(overallSummary, data.overall_summary || "No summary provided.");

        renderList(strongList, data.strong_matches, createStrongCard);
        renderList(partialList, data.partial_matches, function (item) {
          return createGapLikeCard(item, "important", true);
        });
        renderList(gapsList, data.gaps, function (item) {
          return createGapLikeCard(item, "critical", false);
        });

        renderNoiseSkills(data.noise_skills);
        renderBridgeSteps(data.bridge_steps);
        renderAnalystNote(data.analyst_note);

        resultsSection.classList.add("active");
      }

      function validateInputs(jd, skills) {
        let valid = true;
        jdError.textContent = "";
        skillsError.textContent = "";

        if (jd.length < 50) {
          jdError.textContent = "Job description must be at least 50 characters";
          valid = false;
        }

        if (skills.length < 20) {
          skillsError.textContent = "Skills must be at least 20 characters";
          valid = false;
        }

        return valid;
      }

      async function parseErrorMessage(response) {
        try {
          // Prefer structured API error details when available.
          const contentType = response.headers.get("content-type") || "";
          if (contentType.includes("application/json")) {
            const payload = await response.json();
            return payload.error || payload.detail || payload.message || "Request failed.";
          }

          const text = await response.text();
          return text || "Request failed.";
        } catch (err) {
          return "Unable to analyze at this time. Please try again.";
        }
      }

      async function analyze() {
        if (inFlight) {
          return;
        }

        const jd = jdInput.value.trim();
        const skills = skillsInput.value.trim();

        apiError.textContent = "";

        if (!validateInputs(jd, skills)) {
          return;
        }

        setLoadingState(true);

        try {
          const response = await fetch("http://localhost:3000/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ jd: jd, skills: skills }),
          });

          if (!response.ok) {
            const message = await parseErrorMessage(response);
            throw new Error(message);
          }

          const data = await response.json();
          renderResults(data || {});

          resultsSection.scrollIntoView({
            behavior: "smooth",
            block: "start",
          });
        } catch (err) {
          apiError.textContent = err && err.message
            ? err.message
            : "Unable to analyze at this time. Please try again.";
        } finally {
          setLoadingState(false);
        }
      }

      analyzeBtn.addEventListener("click", analyze);

      jdInput.addEventListener("input", function () {
        if (jdInput.value.trim().length >= 50) {
          jdError.textContent = "";
        }
      });

      skillsInput.addEventListener("input", function () {
        if (skillsInput.value.trim().length >= 20) {
          skillsError.textContent = "";
        }
      });

      window.addEventListener("load", function () {
        jdInput.focus();
      });
    })();
  </script>
</body>
</html>
